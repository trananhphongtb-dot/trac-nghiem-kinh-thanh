name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets (launcher icon, stored as base64)
        run: sh scripts/decode-assets.sh
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install deps + add Android platform
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Set minSdkVersion 24 (Play auto-protection)
        run: |
          sed -i 's/^    minSdkVersion = 22/    minSdkVersion = 24/' android/variables.gradle
          grep minSdkVersion android/variables.gradle
      - name: Target API 36 (Play requirement, AGP 8.9.1 + Gradle 8.11.1)
        run: |
          sed -i 's/^    compileSdkVersion = 34/    compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/^    targetSdkVersion = 34/    targetSdkVersion = 36/' android/variables.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:8.2.1'/classpath 'com.android.tools.build:gradle:8.9.1'/" android/build.gradle
          sed -i 's#gradle-8.2.1-all.zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s/classpath 'com.android.tools.build:gradle:8.2.1'/classpath 'com.android.tools.build:gradle:8.9.1'/" node_modules/@capacitor/android/capacitor/build.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          grep "com.android.tools.build:gradle" android/build.gradle
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          grep versionCode android/app/build.gradle
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Make launcher icon (adaptive foreground + dark background)
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/make-launcher-icon.py
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bible-quiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
