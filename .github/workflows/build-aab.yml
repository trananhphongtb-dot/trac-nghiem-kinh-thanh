name: Build AAB (signed)
# Signed AAB for Google Play (closed testing, then production).
# Triggered manually only (workflow_dispatch) so the normal push pipeline
# keeps building the debug APK (build-apk.yml).
# Pattern copied from the proven co-up-online build-aab.yml (v19, accepted by Play):
# build UNSIGNED bundle with ./gradlew bundleRelease (no signingConfigs),
# then sign it with r0adkll/sign-android-release@v1 using the release keystore
# whose base64 is in secret KEYSTORE_BASE64.
# Keystore: bible-quiz-release.keystore, alias biblequiz,
# SHA-1 4C:77:0E:E0:11:69:48:5B:A0:11:CC:F6:5B:C4:76:CD:14:6A:19:0C, valid to 2054.
# Secrets needed: KEYSTORE_BASE64, KEY_ALIAS (= biblequiz),
# KEYSTORE_PASSWORD, KEY_PASSWORD.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install deps + add Android platform
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Set minSdkVersion 24 (Play auto-protection)
        run: |
          # The Capacitor template defaults minSdkVersion to 22, but Play
          # Console's auto-protection rejects any bundle with minSdk below 24.
          sed -i 's/^    minSdkVersion = 22/    minSdkVersion = 24/' android/variables.gradle
          grep minSdkVersion android/variables.gradle
      - name: Target API 36 (Play requirement, AGP 8.9.1 + Gradle 8.11.1)
        run: |
          # Play requires new apps to target API 36. Official minimums for
          # API 36: AGP 8.9.1 + Gradle 8.11.1 + JDK 17 (workflow already uses 17).
          sed -i 's/^    compileSdkVersion = 34/    compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/^    targetSdkVersion = 34/    targetSdkVersion = 36/' android/variables.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:8.2.1'/classpath 'com.android.tools.build:gradle:8.9.1'/" android/build.gradle
          sed -i 's#gradle-8.2.1-all.zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^        versionCode 1/        versionCode 2/' android/app/build.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:8.2.1'/classpath 'com.android.tools.build:gradle:8.9.1'/" node_modules/@capacitor/android/capacitor/build.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          grep "com.android.tools.build:gradle" android/build.gradle
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          grep versionCode android/app/build.gradle
      - name: Install Android SDK 36
        run: |
          # Gradle needs the API 36 platform + build-tools 36 present.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Make launcher icon (adaptive foreground + dark background)
        run: |
          bash scripts/decode-assets.sh
          python3 -m pip install --quiet Pillow
          python3 scripts/make-launcher-icon.py
      - name: Build unsigned AAB
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Sign AAB
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Show signed AAB
        run: ls -la android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: bible-quiz-aab
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
